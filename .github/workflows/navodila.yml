name: Navodila (Word)

# Samodejno (re)generira Word navodila ob spremembi vira navodil ali aplikacije.
on:
  push:
    branches: [ main ]
    paths:
      - 'navodila/**'
      - 'app/src/main/assets/pregled_bk.html'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  navodila:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Namesti odvisnosti
        run: |
          python -m pip install --upgrade pip
          pip install python-docx
          cd navodila
          npm install puppeteer-core

      - name: Namesti Chromium za zajem zaslonov
        uses: browser-actions/setup-chrome@v1
        id: chrome

      - name: Zajem zaslonov iz aplikacije (best-effort)
        continue-on-error: true
        env:
          PUPPETEER_EXECUTABLE_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: |
          cd navodila
          node capture_screens.js

      - name: Generiraj Word navodila
        run: |
          cd navodila
          python generate_navodila.py

      - name: Naloži navodila kot artifact
        uses: actions/upload-artifact@v4
        with:
          name: Navodila_PregledBK
          path: navodila/Navodila_PregledBK.docx
          retention-days: 90
