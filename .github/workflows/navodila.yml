name: Navodila (Word)

# Samodejno (re)generira Word navodila (docs/PregledBK_Navodila.docx) ob spremembi
# gradbenega skripta, posnetkov ali aplikacije. Posnetki so pravi zajemi z Zebre,
# že shranjeni v docs/shots/ — zato v CI ni potreben brskalnik/zajem.
on:
  push:
    branches: [ main ]
    paths:
      - 'docs/build_doc.js'
      - 'docs/shots/**'
      - 'app/src/main/assets/pregled_bk.html'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  navodila:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Namesti odvisnosti
        run: npm install docx

      - name: Generiraj Word navodila
        run: node docs/build_doc.js docs

      - name: Naloži navodila kot artifact
        uses: actions/upload-artifact@v4
        with:
          name: Navodila_PregledBK
          path: docs/PregledBK_Navodila.docx
          retention-days: 90
